name: Frontend CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'feature/**']

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck and build
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test -- --run
