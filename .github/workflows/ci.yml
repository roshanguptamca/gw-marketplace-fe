name: Frontend CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'feature/**']

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck and build
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test -- --run
      - name: Install browser for storefront layout checks
        run: npx playwright install --with-deps chromium
      - name: Check storefront layout on mobile, tablet and desktop
        run: npx playwright test tests/e2e/shop-hero-layout.spec.ts --workers=1
      - name: Upload storefront layout results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: storefront-layout-results
          path: test-results/
          retention-days: 7
